# Example reverse proxy. The application binds to 127.0.0.1 and has no
# authentication of its own, so this is the only listener on a routable
# address. If the network it sits on is not trusted, add auth_basic here.

server {
    listen 80;
    listen [::]:80;
    server_name receipts.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # `http2 on;` needs nginx 1.25.1 or newer. On older versions drop this line
    # and write `listen 443 ssl http2;` instead.
    http2 on;
    server_name receipts.example.com;

    ssl_certificate     /etc/ssl/certs/receipts.example.com.crt;
    ssl_certificate_key /etc/ssl/private/receipts.example.com.key;

    # Receipt texts are short; the preview goes out as a data: URI in the
    # response body rather than as a separate request.
    client_max_body_size 1M;

    location / {
        proxy_pass http://127.0.0.1:8094;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/receipts-access.log;
    error_log  /var/log/nginx/receipts-error.log;
}
