[project]
name = "thermal-receipt-webui"
version = "0.1.0"
description = "Byte accurate ESC/POS receipt preview, command line tool and web interface"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marc Allgeier" }]

[project.urls]
Homepage = "https://github.com/fidpa/thermal-receipt-webui"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", ".venv/*"]
