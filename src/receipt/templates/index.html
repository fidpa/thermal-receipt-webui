<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt</title>
<style>
  :root { color-scheme: light dark;
          --fg:#1a1a1a; --bg:#faf9f7; --line:#d5d0c8; --accent:#3a5f8a;
          --ok:#3f7d4e; --warn:#9a6a1f; --err:#a1443c; --muted:#6b6660;
          /* 48 characters at 14px monospace plus padding and border */
          --editor:27rem;
          --paper:288px;          /* 576 dots of print width, at half size */
          --sheet:calc(var(--paper) + 18px); }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e6e3; --bg:#1c1b1a; --line:#3d3b38; --accent:#7ba7d4;
            --ok:#6fae7e; --warn:#d0a45c; --err:#d78078; --muted:#9c968e; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:1.5rem; background:var(--bg); color:var(--fg);
         font:15px/1.5 system-ui, -apple-system, sans-serif; }
  /* Fixed column widths and a grid only as wide as its content: a 1fr column
     would stretch while the textarea stays put, and the difference would show
     up as a gap down the middle. */
  .wrap { display:grid; grid-template-columns: var(--editor) auto; gap:2.5rem;
          width:max-content; max-width:100%; margin:0 auto; align-items:start; }
  @media (max-width: 820px) {
    .wrap { grid-template-columns: minmax(0,1fr); width:auto; }
  }

  .top { display:flex; align-items:baseline; gap:.75rem; margin:0 0 .8rem; }
  /* The page title lives in the tab; on the page only the screen reader
     still carries it, so the document keeps a heading. */
  .offscreen { position:absolute; width:1px; height:1px; overflow:hidden;
               clip-path:inset(50%); white-space:nowrap; }
  .lamp { display:inline-flex; align-items:center; gap:.4rem;
          font-size:.78rem; color:var(--muted); }
  .lamp::before { content:""; width:.55rem; height:.55rem; border-radius:50%;
                  background:var(--muted); }
  .lamp[data-state=on]::before { background:var(--ok); }
  .lamp[data-state=off]::before { background:var(--err); }

  .tools { display:flex; gap:.35rem; margin:0 0 .5rem; flex-wrap:wrap; }
  .sizes { display:inline-flex; margin:0 0 .5rem; border:1px solid var(--line);
           border-radius:4px; overflow:hidden; }
  .sizes button { border:0; border-radius:0; font-size:.85rem; padding:.3rem .7rem;
                  font-family:inherit; }
  .sizes button + button { border-left:1px solid var(--line); }
  .sizes button[aria-pressed=true] { background:var(--accent); color:#fff; }
  button { border:1px solid var(--line); border-radius:4px; background:var(--bg);
           color:var(--fg); font:inherit; cursor:pointer; padding:.5rem 1rem; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .tools button { font-size:.9rem; padding:.3rem .5rem; min-width:2.6rem;
                  font-family:ui-monospace, "DejaVu Sans Mono", monospace; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }

  textarea { display:block; width:100%; max-width:var(--editor);
             min-height:19rem; resize:vertical; padding:.7rem .8rem;
             border:1px solid var(--line); border-radius:4px;
             background:var(--bg); color:var(--fg);
             font-family:ui-monospace, "DejaVu Sans Mono", monospace;
             font-size:14px; line-height:1.45; tab-size:2; }
  textarea:focus { outline:2px solid var(--accent); outline-offset:-1px; }

  .hint { font-size:.78rem; color:var(--muted); margin:.45rem 0 0; }
  .warn { font-size:.82rem; color:var(--warn); margin:.5rem 0 0; }

  .actions { display:flex; align-items:center; gap:.8rem; margin:1.1rem 0 0; }
  .status { font-size:.85rem; min-height:1.3em; }
  .status[data-kind=ok] { color:var(--ok); }
  .status[data-kind=err] { color:var(--err); }

  .history { margin:2rem 0 0; }
  .history h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.05em;
                color:var(--muted); font-weight:600; margin:0 0 .5rem; }
  .history ol { list-style:none; margin:0; padding:0; }
  .history li + li { border-top:1px solid var(--line); }
  .history button { width:100%; text-align:left; border:0; border-radius:0;
                    padding:.45rem .2rem; display:flex; gap:.7rem; align-items:baseline; }
  .history button:hover { background:color-mix(in srgb, var(--accent) 8%, transparent); }
  .history time { font-size:.72rem; color:var(--muted); flex:none;
                  font-variant-numeric:tabular-nums; }
  .history .label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
                    font-size:.85rem; }
  .history p { font-size:.8rem; color:var(--muted); margin:0; }

  .paper { background:#fff; padding:8px; border:1px solid var(--line);
           border-radius:2px; box-shadow:0 1px 4px rgba(0,0,0,.12); }
  .paper img { display:block; width:var(--paper); image-rendering:pixelated; }
  .meta { font-size:.75rem; color:var(--muted); margin-top:.5rem; text-align:center;
          width:var(--sheet); font-variant-numeric:tabular-nums; }
  .empty { width:var(--sheet); height:200px; display:grid; place-items:center;
           border:1px dashed var(--line); border-radius:4px;
           font-size:.85rem; color:var(--muted); }
  /* Without justify-self the sheet stretched to the full width in the single
     column layout while the receipt stayed stuck to its left edge. */
  .wrap > aside { justify-self:start; position:sticky; top:1.5rem; }
  @media (max-width: 820px) { .wrap > aside { position:static; } }
</style>
</head>
<body>
<div class="wrap">
  <section>
    <h1 class="offscreen">Receipt</h1>
    <div class="top">
      <span class="lamp" id="lamp">checking printer</span>
    </div>

    <div class="sizes" role="group" aria-label="Type size">
      {% for key, label in [("small", "Small"), ("normal", "Normal"), ("large", "Large")] %}
        <button type="button" class="size" data-size="{{ key }}" data-cols="{{ sizes[key] }}"
                aria-pressed="{{ 'true' if key == default_size else 'false' }}"
                title="{{ sizes[key] }} characters per line">{{ label }}</button>
      {% endfor %}
    </div>

    <div class="tools">
      <button type="button" id="btn-heading" aria-label="Heading"
              title="Heading (# at the start of the line)">#</button>
      <button type="button" id="btn-bold" aria-label="Bold" title="Bold (Ctrl+B)">**</button>
      <button type="button" id="btn-underline" aria-label="Underline"
              title="Underline (Ctrl+U)">_</button>
      <button type="button" id="btn-rule" aria-label="Rule" title="Rule">---</button>
    </div>

    <textarea id="text" autofocus spellcheck="true"
              placeholder="Type your text, or drop a text file here - the preview follows along."></textarea>

    <p class="hint"><span id="cols">{{ sizes[default_size] }}</span> characters per line</p>
    <p class="warn" id="warning" hidden></p>

    <div class="actions">
      <button type="button" id="btn-print" class="primary" disabled>Print</button>
      <button type="button" id="btn-clear">Clear</button>
      <span class="status" id="status" role="status" aria-live="polite"></span>
    </div>

    <div class="history">
      <h2>Recently printed</h2>
      <ol id="history"></ol>
      <p id="history-empty">Nothing printed yet.</p>
    </div>
  </section>

  <aside>
    <div id="paper-slot"><div class="empty">Preview</div></div>
    <div class="meta" id="meta"></div>
  </aside>
</div>

<script>
"use strict";

const el = (id) => document.getElementById(id);
const text = el("text");
const paperSlot = el("paper-slot");
const meta = el("meta");
const warning = el("warning");
const status = el("status");
const lamp = el("lamp");
const printBtn = el("btn-print");

let currentSize = document.querySelector(".size[aria-pressed=true]").dataset.size;
let currentSha = null;
let printerReady = false;
let previewSeq = 0;
let debounce = null;

function setStatus(message, kind) {
  status.textContent = message || "";
  if (kind) { status.dataset.kind = kind; } else { delete status.dataset.kind; }
}

function updatePrintButton() {
  printBtn.disabled = !printerReady || currentSha === null;
}

async function refreshPreview() {
  const seq = ++previewSeq;
  let data;
  try {
    const res = await fetch("/api/preview", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text.value, size: currentSize }),
    });
    if (!res.ok) {
      // The server explains its refusal (text too long, for instance); without
      // this there would only be a status number.
      const body = await res.json().catch(() => null);
      throw new Error(body && body.message ? body.message : "HTTP " + res.status);
    }
    data = await res.json();
  } catch (err) {
    if (seq === previewSeq) { setStatus("Preview failed: " + err.message, "err"); }
    return;
  }
  if (seq !== previewSeq) { return; }
  document.getElementById("cols").textContent = data.cols;

  if (data.empty) {
    paperSlot.innerHTML = '<div class="empty">Preview</div>';
    meta.textContent = "";
    warning.hidden = true;
    currentSha = null;
  } else {
    const img = new Image();
    img.src = data.png;
    img.alt = "Preview of the receipt";
    paperSlot.innerHTML = "";
    const paper = document.createElement("div");
    paper.className = "paper";
    paper.appendChild(img);
    paperSlot.appendChild(paper);
    meta.textContent = `${data.length_cm_text} cm of paper \u00b7 ${data.bytes} bytes \u00b7 checksum ${data.sha}`;
    warning.textContent = data.warning || "";
    warning.hidden = !data.warning;
    currentSha = data.sha;
  }
  updatePrintButton();
}

function schedulePreview() {
  clearTimeout(debounce);
  debounce = setTimeout(refreshPreview, 250);
}

async function refreshPrinter() {
  try {
    const res = await fetch("/api/printer");
    const data = await res.json();
    printerReady = Boolean(data.configured);
    if (!data.configured) {
      lamp.dataset.state = "off";
      lamp.textContent = "No printer configured";
    } else if (data.printer && !data.printer.ready) {
      // The printer answers but is not ready to print - paper, cover or a
      // device fault. The button stays on: the refusal then comes from the
      // service and names the reason.
      lamp.dataset.state = "off";
      lamp.textContent = `${data.host}: ${data.printer.reason}`;
    } else if (data.reachable) {
      lamp.dataset.state = "on";
      lamp.textContent = data.printer && data.printer.paper_low
        ? `${data.host} reachable \u00b7 roll running out`
        : `${data.host} reachable`;
    } else {
      lamp.dataset.state = "off";
      lamp.textContent = `${data.host} not answering`;
    }
  } catch (err) {
    printerReady = false;
    lamp.dataset.state = "off";
    lamp.textContent = "Status unknown";
  }
  updatePrintButton();
}

function renderHistory(entries) {
  const list = el("history");
  const emptyNote = el("history-empty");
  list.innerHTML = "";
  emptyNote.hidden = entries.length > 0;

  for (const entry of entries) {
    const when = new Date(entry.printed_at);
    const item = document.createElement("li");
    const button = document.createElement("button");
    button.type = "button";
    const stamp = document.createElement("time");
    stamp.dateTime = entry.printed_at;
    stamp.textContent = when.toLocaleString(undefined,
      { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = entry.label;
    button.append(stamp, label);
    button.title = SIZE_LABELS[entry.size] || entry.size;
    button.addEventListener("click", () => {
      text.value = entry.text;
      // Without the size, a reprint would silently be a different receipt.
      selectSize(entry.size);
      text.focus();
      setStatus("Loaded from the history.");
      refreshPreview();
    });
    item.appendChild(button);
    list.appendChild(item);
  }
}

async function refreshHistory() {
  try {
    const res = await fetch("/api/history");
    const data = await res.json();
    renderHistory(data.entries || []);
  } catch (err) {
    /* The history is a convenience; a failure here must not break the page. */
  }
}

async function doPrint() {
  if (printBtn.disabled) { return; }
  printBtn.disabled = true;
  setStatus("Sending to the printer...");
  try {
    const res = await fetch("/api/print", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text.value, sha: currentSha, size: currentSize }),
    });
    const data = await res.json();
    if (data.ok) {
      setStatus(data.message, "ok");
      text.value = "";
      currentSha = null;
      refreshPreview();
      refreshHistory();
    } else {
      setStatus(data.message, "err");
    }
  } catch (err) {
    setStatus("Print failed: " + err.message, "err");
  }
  refreshPrinter();
}

const SIZE_LABELS = { small: "Small", normal: "Normal", large: "Large" };

function selectSize(key) {
  for (const button of document.querySelectorAll(".size")) {
    const active = button.dataset.size === key;
    button.setAttribute("aria-pressed", active ? "true" : "false");
    if (active) { currentSize = key; }
  }
}

function replaceSelection(before, after, placeholder) {
  const start = text.selectionStart;
  const end = text.selectionEnd;
  const selected = text.value.slice(start, end) || placeholder;
  text.setRangeText(before + selected + after, start, end, "select");
  if (!text.value.slice(start, end)) {
    text.selectionStart = start + before.length;
    text.selectionEnd = start + before.length + selected.length;
  }
  text.focus();
  schedulePreview();
}

function toggleLinePrefix(prefix) {
  const value = text.value;
  const caret = text.selectionStart;
  const start = value.lastIndexOf("\n", caret - 1) + 1;
  const lineEnd = value.indexOf("\n", caret);
  const stop = lineEnd === -1 ? value.length : lineEnd;
  const line = value.slice(start, stop);
  const stripped = line.replace(/^#{1,6}\s+/, "");
  const next = line === stripped ? prefix + line : stripped;
  text.setRangeText(next, start, stop, "end");
  text.focus();
  schedulePreview();
}

function insertRule() {
  const value = text.value;
  const caret = text.selectionStart;
  const prefix = caret > 0 && value[caret - 1] !== "\n" ? "\n" : "";
  text.setRangeText(prefix + "---\n", caret, text.selectionEnd, "end");
  text.focus();
  schedulePreview();
}

for (const button of document.querySelectorAll(".size")) {
  button.addEventListener("click", () => {
    selectSize(button.dataset.size);
    document.getElementById("cols").textContent = button.dataset.cols;
    text.focus();
    refreshPreview();
  });
}

// Dropping a text file on the field is the more convenient route to the same
// text. What gets printed is still only what the preview then shows, and the
// length limit is the server's - there is no second threshold here.
text.addEventListener("dragover", (event) => {
  // Only step in for files: dragged text should still land where the browser
  // would insert it.
  if (event.dataTransfer.types.includes("Files")) { event.preventDefault(); }
});

text.addEventListener("drop", async (event) => {
  const file = event.dataTransfer.files[0];
  if (!file) { return; }
  event.preventDefault();
  // An empty type is common for .md and unknown extensions; an image never has one.
  if (file.type && !file.type.startsWith("text/")) {
    setStatus(`${file.name} is not a text file.`, "err");
    return;
  }
  try {
    text.value = await file.text();
  } catch (err) {
    setStatus("Could not read the file: " + err.message, "err");
    return;
  }
  setStatus(`Loaded ${file.name}.`);
  text.focus();
  refreshPreview();
});

text.addEventListener("input", schedulePreview);
el("btn-print").addEventListener("click", doPrint);
el("btn-bold").addEventListener("click", () => replaceSelection("**", "**", "bold"));
el("btn-underline").addEventListener("click", () =>
  replaceSelection("_", "_", "underline"));
el("btn-heading").addEventListener("click", () => toggleLinePrefix("# "));
el("btn-rule").addEventListener("click", insertRule);
el("btn-clear").addEventListener("click", () => {
  text.value = "";
  text.focus();
  setStatus("");
  refreshPreview();
});

text.addEventListener("keydown", (event) => {
  if (!(event.ctrlKey || event.metaKey)) { return; }
  if (event.key === "b" || event.key === "B") {
    event.preventDefault();
    replaceSelection("**", "**", "bold");
  } else if (event.key === "u" || event.key === "U") {
    event.preventDefault();
    replaceSelection("_", "_", "underline");
  } else if (event.key === "Enter") {
    event.preventDefault();
    doPrint();
  }
});

refreshPrinter();
refreshHistory();
// Browsers restore the contents of a <textarea> on reload. Without this call
// there would be text in the field but no image beside it, and the print button
// would stay off until someone pressed a key.
if (text.value.trim()) { refreshPreview(); }
setInterval(refreshPrinter, 30000);
</script>
</body>
</html>
