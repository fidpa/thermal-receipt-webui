name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called by release.yml, so a tag cannot publish a release past red tests.
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The preview renders text with DejaVu Sans Mono. ubuntu-latest ships it,
      # but naming the package keeps the job honest if that ever changes.
      - name: Install fonts
        run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      # The same pins as a local run: requirements-dev.txt carries pytest.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests/
