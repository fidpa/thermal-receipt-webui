name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # A tag publishes nothing past red checks: both run again on the tagged commit.
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Both version sources match the tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          DECLARED=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          PACKAGE=$(grep -m1 '^__version__ = ' src/receipt/__init__.py | cut -d'"' -f2)
          test "$VERSION" = "$DECLARED" || {
            echo "tag v${VERSION} does not match pyproject.toml ${DECLARED}"
            exit 1
          }
          test "$VERSION" = "$PACKAGE" || {
            echo "tag v${VERSION} does not match src/receipt/__init__.py ${PACKAGE}"
            exit 1
          }

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          HEADING="## [${VERSION}]"

          # Three anchors: index() instead of a regex, because the brackets
          # would need escaping; !p against a heading that occurs twice; and
          # /^\[[0-9]/ so the link definitions at the end stay out of the notes.
          awk -v head="$HEADING" '
            !p && index($0, head) == 1 { p=1; next }
            /^## / { if (p) exit }
            /^\[[0-9]/ { if (p) exit }
            p { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > release-notes.md
          test -s release-notes.md || { echo "Empty release notes for $VERSION"; exit 1; }

          HEADLINE=$(awk -v head="$HEADING" '
            index($0, head) == 1 {
              if (match($0, /- [0-9]{4}-[0-9]{2}-[0-9]{2}: /)) {
                print substr($0, RSTART + RLENGTH); exit
              }
            }
          ' CHANGELOG.md)
          if [ -n "$HEADLINE" ]; then
            echo "title=v${VERSION}: ${HEADLINE}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No headline in the heading for ${VERSION}, using the bare tag name"
            echo "title=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.changelog.outputs.title }}
          body_path: release-notes.md
