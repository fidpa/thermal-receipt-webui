name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pinned on purpose: an unpinned install once pulled a Ruff whose default
      # rule set had grown, turning this job red on an unchanged tree.
      - name: Install ruff
        run: pip install ruff==0.9.6
      - name: Lint
        run: ruff check src/ tests/
      - name: Format check
        run: ruff format --check src/ tests/
